name: CI/CD Pipeline

on:
  push:
    branches: ['**']  # Запускать на всех ветках
  pull_request:
    branches: ['**']  # Запускать на PR в любую ветку

env:
  DOCKER_BUILDKIT: 1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --only main --no-root

      - name: Run linter
        run: |
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          poetry run black --check . || true

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci-cd-12345
          DEBUG: '0'
          ALLOWED_HOSTS: localhost,127.0.0.1
          # Используем SQLite для тестов (быстрее, не требует PostgreSQL)
          DB_ENGINE: django.db.backends.sqlite3
          # DB_NAME не указываем, будет использован :memory: для тестов
        run: |
          poetry run python manage.py test

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate docker-compose.yml
        run: |
          docker compose config

      - name: Build Docker image
        run: |
          docker build -t drf-project:test .

      - name: Test Docker Compose build
        run: |
          docker compose config
          
      - name: Test Docker Compose syntax
        run: |
          docker compose config --quiet
          
      # Опционально: можно добавить проверку hadolint для Dockerfile
      # - name: Lint Dockerfile
      #   uses: hadolint/hadolint-action@v3.1.0
      #   with:
      #     dockerfile: Dockerfile
      #     failure-threshold: warning

  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    # Деплой ТОЛЬКО на продакшн ветки (main/master/develop)
    # С feature веток автоматический деплой НЕ выполняется
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ~/apps/REPO_NAME
            git pull
            docker compose down
            docker compose pull
            docker compose build --no-cache
            docker compose up -d
            docker compose exec -T web python manage.py migrate
            docker compose exec -T web python manage.py collectstatic --noinput
            docker compose restart nginx